name: installer

# Builds the player's installer. Run it by hand from the Actions tab (the
# installer comes back as a download on the run), or push a tag like v1.0.0
# to also get a draft release with the installer attached.
#
# Here rather than on the development machine because pip there cannot reach
# PyPI, and freezing needs PyInstaller and the speech libraries from it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Freeze
        run: python installer/freeze.py

      - name: Check the frozen program starts
        shell: pwsh
        run: |
          $p = Start-Process dist\AccessNeverChanges\AccessNeverChanges.exe -ArgumentList "install","--check","C:\nowhere" -Wait -PassThru
          Get-Content dist\AccessNeverChanges\install.log
          if (-not (Select-String -Path dist\AccessNeverChanges\install.log -Pattern "Fallout 2: C:\\nowhere" -Quiet)) { throw "the frozen program did not run install.py" }
          Remove-Item dist\AccessNeverChanges\install.log

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = python -c "from fallout2_access.version import VERSION; print(VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\AccessNeverChanges.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: AccessNeverChanges-${{ steps.version.outputs.version }}-setup
          path: dist/AccessNeverChanges-*-setup.exe

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/changelog.py --out dist\notes.md
          if ($LASTEXITCODE -ne 0) { throw "write this version's notes in CHANGELOG.md first" }
          gh release create "${{ github.ref_name }}" (Get-Item dist\AccessNeverChanges-*-setup.exe).FullName --draft --title "Access Never Changes ${{ steps.version.outputs.version }}" --notes-file dist\notes.md
