; Access Never Changes, keys.
; Lines starting with a semicolon are notes, and are ignored. Change a key, save the file, and start the mod again.
; Keys are written the way F1 says them: A, F5, Numpad 7, Numpad plus, Semicolon, Left bracket, Slash, Page up. Hold a key with Shift or Control by writing Shift+ or Control+ in front of it: Control+Slash.
; The arrows, Enter, Escape, Backspace, Tab, Home, End, the number row, Apostrophe, Backslash and Numpad 0 cannot be moved: every screen, or the mod itself, depends on them.
; A key that is not right, or that two lines ask for, goes back to what it was, and f2access.log says which.
; The keys in [map] are taken from the game while it is on a map, so a key the game uses for something else stops doing that there. The keys in [everywhere] work on every screen, and the game still hears them, apart from help and the message log.

[map]
; Look cursor one hex north-west; a square on the world map.
cursor_northwest = Numpad 7
; North-east.
cursor_northeast = Numpad 9
; West.
cursor_west = Numpad 4
; East.
cursor_east = Numpad 6
; South-west.
cursor_southwest = Numpad 1
; South-east.
cursor_southeast = Numpad 3
; North, on the world map only; hexes have no north. Also the previous item in a list.
cursor_north = Numpad 8
; South, on the world map only. Also the next item in a list.
cursor_south = Numpad 2
; Back to you. In a list, say it again.
cursor_home = Numpad 5
; The scanner: the previous kind of thing. Places you know, on the world map.
scan_kind_previous = Left bracket
; The next kind of thing.
scan_kind_next = Right bracket
; The previous one of that kind.
scan_one_previous = Shift+Left bracket
; The next one of that kind.
scan_one_next = Shift+Right bracket
; The previous category: critters, items, scenery, exits.
scan_category_previous = Control+Left bracket
; The next category.
scan_category_next = Control+Right bracket
; Put the look cursor on what the scanner is on.
scan_go = Slash
; The way to the look cursor.
route_say = Shift+Slash
; Walk all the way to the look cursor; again to stop.
route_walk = Control+Slash
; Health, action points and armour class.
status = Semicolon
; What is in your hand.
weapon = Shift+Semicolon
; Use what is in your hand.
use_hand = U
; How much light is on the look cursor's hex.
light = Shift+1
; What can I do to this; on other screens, the full description.
menu = Numpad dot

[everywhere]
; Left mouse button, on the look cursor's hex.
left_click = Numpad plus
; Right mouse button: the cursor mode.
right_click = Numpad minus
; Where you are.
where_am_i = Numpad star
; Say it again.
say_again = Numpad slash
; The keys for the screen you are on.
help = F1
; The message log, older.
log_older = Shift+Comma
; The message log, newer.
log_newer = Shift+Period
; Offer, when trading.
barter_offer = O
