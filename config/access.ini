; Access Never Changes, settings.
; Lines starting with a semicolon are notes, and are ignored. Change a value, save the file, and start the mod again. A value the mod cannot make sense of is ignored in favour of the default, and f2access.log says which.

[speech]
; Which voice to use. auto: NVDA if it is running, then JAWS and other screen readers, then the Windows voice. nvda: NVDA first. accessible_output2: whichever screen reader is running. sapi: the Windows voice, with no screen reader at all.
backend = auto

[general]
; Which file in the lang folder to speak from, without ".ini". auto follows the game's own language setting, and falls back to English for anything the chosen file does not have.
language = auto

; Keep speaking when the game is not the window in front.
speak_without_focus = no

; A tick for every hex you walk.
step_sound = yes

; The mod's own keys. Turning this off leaves only what the mod says by itself.
hotkeys = yes

[game]
; The Fallout 2 folder. Leave empty to use the folder this one is inside.
folder =

; Close the mod when the game closes.
exit_with_game = yes
