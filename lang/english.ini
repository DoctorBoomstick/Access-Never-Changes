[window]
directx = The game is running full screen through DirectX, and the mod cannot aim the pointer that way. {fix} Reading and speaking still work; clicking does not.
fix = Set Mode to 5 under Graphics in ddraw dot ini and restart the game. Not WINDOWED in f2_res.ini -- with the built-in high resolution patch that setting is ignored.
fullscreen = The game is running full screen, and the mod cannot aim the pointer that way. {fix} Reading and speaking still work; clicking does not.
not_found = Cannot find the game's window. If the game is running full screen, set Mode to 5 under Graphics in ddraw.ini and restart it.

